# Publishes the package to npm, with a provenance statement, when a version
# tag is pushed. The build job has read-only access; the publish job holds the
# publish rights and only publishes the tarball the build job packed.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the tagged commit can be checked against main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check the tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

      - name: Install dependencies
        run: 'npm ci --ignore-scripts'

      - name: Run lint
        run: 'npm run lint'

      - name: Run tests
        run: 'npm test'

      - name: Run build
        run: 'npm run build'

      - name: Pack
        run: mv "$(npm pack --ignore-scripts --silent)" package.tgz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: package.tgz
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: read
      # Signs the provenance statement, and authenticates a trusted publisher
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later
      - name: Check the npm version
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error(`npm ${process.argv[1]} is older than 11.5.1`); process.exit(1); }
          ' "$(npm --version)"

      # Publishing the tarball runs no package scripts
      - name: Publish
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish ./package.tgz --provenance --access public --tag "$dist_tag"
        env:
          # Set only for the first publish. With it unset, npm authenticates
          # through the trusted publisher.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
