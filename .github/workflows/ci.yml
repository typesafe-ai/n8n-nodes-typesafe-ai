name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The org's CI ruleset requires a passing check with this name
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      # Lint, test and build need no install scripts, so none are run
      - name: Install dependencies
        run: 'npm ci --ignore-scripts'

      - name: Run lint
        run: 'npm run lint'

      - name: Run tests
        run: 'npm test'

      - name: Run build
        run: 'npm run build'
